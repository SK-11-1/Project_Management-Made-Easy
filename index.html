<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Management Made Easy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #050814;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .logo-container {
            width: 650px;
            max-width: 90%;
            padding: 50px;
            border-radius: 30px;

            background: rgba(255, 255, 255, 0.03);

            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 0 60px rgba(35, 150, 255, 0.12),
                inset 0 0 40px rgba(255, 255, 255, 0.02);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 100%;
            max-width: 520px;
            height: auto;
            display: block;

            filter:
                drop-shadow(0 0 20px rgba(45, 190, 255, 0.25))
                drop-shadow(0 0 40px rgba(130, 70, 255, 0.15));
        }

        @media (max-width: 600px) {

            .logo-container {
                padding: 25px;
            }

        }
    </style>
</head>

<body>

    <div class="logo-container">

        <img src="logo.png" alt="Management Made Easy Logo">

    </div>

</body>
</html>
